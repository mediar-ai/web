[package]
name = "workflow-executor"
version = "0.2.5"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["json", "ws", "macros"] }
tower = { version = "0.5", features = ["limit", "timeout", "tracing"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-br"] }

# MCP client support
rmcp = { version = "=0.6.3", features = [
    "transport-child-process",
    "client",
    "transport-streamable-http-client-reqwest",
] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# OpenTelemetry
opentelemetry = "0.27"
opentelemetry-otlp = { version = "0.27", features = ["http-proto", "reqwest-client"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-appender-tracing = "0.27"
opentelemetry-semantic-conventions = "0.27"
tracing-opentelemetry = "0.28"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

# GitHub API
octocrab = "0.41"

# Base64 encoding/decoding
base64 = "0.22"

# Encryption (for secrets management)
ring = "0.17"
sha2 = "0.10"

# Storage (Supabase compatible)
object_store = { version = "0.11", features = ["http"] }
url = "2.5"
bytes = "1.8"

# Environment
dotenvy = "0.15"

# Validation
validator = { version = "0.19", features = ["derive"] }

# Queue management
deadpool = "0.12"

# System info
hostname = "0.4"

# Random number generation
rand = "0.8"

# Sentry for error tracking and performance monitoring
sentry = { version = "0.45", features = ["tracing", "tower", "tower-http", "tower-axum-matched-path", "reqwest", "rustls"] }
sentry-tracing = "0.45"
sentry-tower = "0.45"
zip = "6.0.0"

[dev-dependencies]
mockito = "1.6"
tempfile = "3.14"
rstest = "0.23"
test-log = { version = "0.2", features = ["trace"] }
wiremock = "0.6"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

# Dev profile optimizations for faster builds
[profile.dev]
opt-level = 1          # Basic optimizations (faster than 0, much faster to compile than 2+)
debug = 0              # No debug symbols (faster linking)
split-debuginfo = "unpacked"  # Avoid PDB contention on Windows
codegen-units = 256    # Max parallelism

[profile.dev.package."*"]
opt-level = 2          # Optimize dependencies more (they don't change often)
