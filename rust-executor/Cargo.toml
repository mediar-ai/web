[package]
name = "workflow-executor"
version = "0.1.1"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["json", "ws", "macros"] }
tower = { version = "0.5", features = ["limit", "timeout", "tracing"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-br"] }

# MCP client support
rmcp = { version = "=0.6.3", features = [
    "transport-child-process",
    "client",
    "transport-streamable-http-client-reqwest",
] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

# GitHub API
octocrab = "0.41"

# Base64 encoding/decoding
base64 = "0.22"

# Storage (Supabase compatible)
object_store = { version = "0.11", features = ["http"] }
url = "2.5"
bytes = "1.8"

# Environment
dotenvy = "0.15"

# Validation
validator = { version = "0.19", features = ["derive"] }

# Queue management
deadpool = "0.12"

# System info
hostname = "0.4"

[dev-dependencies]
mockito = "1.6"
tempfile = "3.14"
rstest = "0.23"
test-log = { version = "0.2", features = ["trace"] }
wiremock = "0.6"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1