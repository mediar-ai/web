[package]
name = "mediar"
version = "1.3.0"
description = "A workflow recording and automation tool."
authors = ["you"]
edition = "2021"
default-run = "mediar"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mediar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "test_backend"
path = "bin/test_backend.rs"

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }
ureq = { version = "2.9", features = ["json"] }
zip = "0.6"
serde_json = "1.0"

[dependencies]
tauri = { version = "2.7.0", features = ["tray-icon", "devtools"] }
tauri-plugin-autostart = "2.5.0"
tauri-plugin-shell = "2.3.0"
tauri-plugin-updater = "2.9.0"
tauri-plugin-dialog = "2.3.0"
tauri-plugin-process = "2.3.0"
tauri-plugin-single-instance = "2.3.0"
tauri-plugin-notification = "2.3.0"
tauri-plugin-global-shortcut = "2.3.0"
tauri-plugin-log = "=2.6.0"
tauri-plugin-deep-link = "2.0.1"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-window-state = "2"

# Type generation for TypeScript
specta = { version = "=2.0.0-rc.22", features = ["export", "derive", "serde_json"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "multipart"] }
log = "0.4"
tracing = "0.1"
tracing-log = "0.2"  # Bridge tracing to log for tauri-plugin-log
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tokio = { version = "1.41.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
notify = "8"
notify-debouncer-mini = "0.7"
anyhow = "1.0.91"
dirs = "5.0"

# Workflow recording dependencies
# Always reference crates.io versions here
# For local development, use src-tauri/.cargo/config.toml to patch with local sources
terminator-workflow-recorder = ">=0.24"
terminator-rs = ">=0.24"


chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
rand = "0.8"
hostname = "0.4"

# MCP (Model Context Protocol) dependencies
futures = "0.3"

# ACP (Agent Client Protocol) for Claude Code integration
agent-client-protocol = "0.9"
async-trait = "0.1"

once_cell = "1.19"
open = "5"  # Open URLs in default browser (OAuth callback)
sysinfo = "0.35.2"
regex = "1.10"
image = "0.25.6"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
base64 = "0.22.1"
similar = "2.6"  # Text diffing for UI tree comparison
# sha2 for PKCE OAuth (default-features=false = pure Rust, no SIMD/asm that caused SIGILL)
sha2 = { version = "0.10", default-features = false }
# Note: edit_history.rs uses FNV-1a instead of sha2 for its hashing
trash = "5.2"  # Move files to trash instead of permanent delete

# Sentry error tracking
sentry = { version = "0.42", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls", "tracing"] }
sentry-tracing = "0.42"
tauri-plugin-sentry = "0.5"

urlencoding = "2.1"  # URL decoding for deep link parameters
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3"

# Windows API for edge glow and process management
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
winreg = "0.55"  # Windows registry access for Chrome extension auto-install

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-positioner = "2"
