<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VNC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #000; }
    #screen { width: 100%; height: 100%; }
    #status {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #888;
      font-family: sans-serif;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="status">Connecting...</div>
  <div id="screen"></div>

  <script type="module">
    import RFB from '/novnc/core/rfb.js';

    const params = new URLSearchParams(window.location.search);
    const target = params.get('target');
    const password = params.get('password') || 'mediar123';

    if (!target) {
      document.getElementById('status').textContent = 'No target specified';
    } else {
      const wsUrl = 'ws://' + window.location.hostname + ':3334?target=' + target;
      const statusEl = document.getElementById('status');

      try {
        const rfb = new RFB(document.getElementById('screen'), wsUrl, {
          credentials: { password: password }
        });

        rfb.scaleViewport = true;
        rfb.resizeSession = true;

        rfb.addEventListener('connect', function() {
          statusEl.style.display = 'none';
        });

        rfb.addEventListener('disconnect', function(e) {
          statusEl.style.display = 'block';
          statusEl.textContent = 'Disconnected: ' + (e.detail && e.detail.reason ? e.detail.reason : 'Unknown');
        });

        rfb.addEventListener('credentialsrequired', function() {
          rfb.sendCredentials({ password: password });
        });

        rfb.addEventListener('securityfailure', function(e) {
          statusEl.textContent = 'Auth failed: ' + (e.detail && e.detail.reason ? e.detail.reason : 'Check password');
        });
      } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
