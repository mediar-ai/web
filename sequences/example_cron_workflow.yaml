---
# Example Cron Workflow - Health Check System
# Runs every 5 minutes to check system status
# Format: "SECOND MINUTE HOUR DAY MONTH DAY_OF_WEEK"
cron: "0 */5 * * * *"
timezone: "UTC"
enabled: true
max_concurrent: 1
retry_on_failure: true
retry_count: 3
stop_on_error: false

tool_name: execute_sequence
arguments:
  variables:
    health_check_url:
      type: string
      label: Health Check URL
      description: URL to check for system health
      default: "https://app.mediar.ai/api/health"
    notification_webhook:
      type: string
      label: Notification Webhook
      description: Webhook URL for notifications
      default: ""
    max_response_time_ms:
      type: string
      label: Max Response Time (ms)
      description: Maximum acceptable response time in milliseconds
      default: "5000"
      regex: "^\\d+$"

  inputs:
    health_check_url: "https://app.mediar.ai/api/health"
    notification_webhook: ""
    max_response_time_ms: "5000"

  steps:
    - tool_name: "run_command"
      arguments:
        unix_command: "echo 'Starting health check at $(date)'"
      delay_ms: 100

    - tool_name: "run_command"
      arguments:
        unix_command: "curl -s -w '%{http_code},%{time_total}' -o /dev/null '${{health_check_url}}' || echo 'CURL_FAILED'"
      delay_ms: 1000

    - tool_name: "run_command"
      arguments:
        unix_command: "echo 'Health check completed at $(date)'"
      delay_ms: 100
# Alternative cron expressions (uncomment to use):
# cron: "0 0 2 * * *"     # Every day at 2 AM
# cron: "0 0 9 * * 1-5"   # Weekdays at 9 AM
# cron: "0 0 0 * * 1"     # Every Monday at midnight
# cron: "0 0 */2 * * *"   # Every 2 hours
# cron: "0 */15 * * * *"  # Every 15 minutes
# cron: "*/30 * * * * *"  # Every 30 seconds
