name: Deploy Modal Apps

on:
  push:
    branches:
      - main
    paths:
      - 'modal_apps/**'
      - '.github/workflows/deploy-modal.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Modal
        run: |
          pip install modal
          pip install pyyaml psycopg2-binary aiohttp

      - name: Deploy workflow-executor
        if: |
          contains(github.event.head_commit.modified, 'modal_apps/workflow_executor.py') ||
          contains(github.event.head_commit.modified, 'modal_apps/lib/') ||
          github.event_name == 'workflow_dispatch'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          cd modal_apps
          modal deploy workflow_executor.py

      - name: Deploy cleanup-tasks
        if: |
          contains(github.event.head_commit.modified, 'modal_apps/cleanup_tasks.py') ||
          contains(github.event.head_commit.modified, 'modal_apps/lib/') ||
          github.event_name == 'workflow_dispatch'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          cd modal_apps
          modal deploy cleanup_tasks.py

      - name: Deploy other Modal apps
        if: |
          contains(github.event.head_commit.modified, 'modal_apps/') &&
          !contains(github.event.head_commit.modified, 'modal_apps/workflow_executor.py') &&
          !contains(github.event.head_commit.modified, 'modal_apps/cleanup_tasks.py')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          # Find and deploy other modified Modal apps
          for file in modal_apps/*.py; do
            if [[ -f "$file" ]] && grep -q "modal.App" "$file"; then
              echo "Deploying $file"
              modal deploy "$file" || echo "Skipped $file (not a deployable app)"
            fi
          done