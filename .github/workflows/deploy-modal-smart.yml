name: Smart Modal Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'modal_apps/**/*.py'
      - '.github/workflows/deploy-modal-smart.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'modal_apps/**/*.py'
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Deploy all Modal apps'
        required: false
        default: 'false'
        type: boolean

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      workflow_executor_changed: ${{ steps.changes.outputs.workflow_executor }}
      cleanup_tasks_changed: ${{ steps.changes.outputs.cleanup_tasks }}
      lib_changed: ${{ steps.changes.outputs.lib }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            workflow_executor:
              - 'modal_apps/workflow_executor.py'
              - 'modal_apps/output_enrichment.py'
            cleanup_tasks:
              - 'modal_apps/cleanup_tasks.py'
            high_frequency_processor:
              - 'modal_apps/high_frequency_processor.py'
            simple_queue_processor:
              - 'modal_apps/simple_queue_processor.py'
            lib:
              - 'modal_apps/lib/**'

  deploy-modal-apps:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.outputs.workflow_executor_changed == 'true' ||
      needs.detect-changes.outputs.cleanup_tasks_changed == 'true' ||
      needs.detect-changes.outputs.high_frequency_processor_changed == 'true' ||
      needs.detect-changes.outputs.simple_queue_processor_changed == 'true' ||
      needs.detect-changes.outputs.lib_changed == 'true' ||
      github.event.inputs.deploy_all == 'true' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('modal_apps/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install modal
          pip install pyyaml psycopg2-binary aiohttp httpx

      - name: Setup Modal authentication
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          # Modal will use these env vars automatically
          echo "Modal authentication configured"

      - name: Deploy workflow-executor
        if: |
          needs.detect-changes.outputs.workflow_executor_changed == 'true' ||
          needs.detect-changes.outputs.lib_changed == 'true' ||
          github.event.inputs.deploy_all == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          echo "Deploying workflow-executor..."
          cd modal_apps
          modal deploy workflow_executor.py --name workflow-executor
          echo "✅ workflow-executor deployed successfully"

      - name: Deploy cleanup-tasks
        if: |
          needs.detect-changes.outputs.cleanup_tasks_changed == 'true' ||
          needs.detect-changes.outputs.lib_changed == 'true' ||
          github.event.inputs.deploy_all == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          echo "Deploying cleanup-tasks..."
          cd modal_apps
          modal deploy cleanup_tasks.py --name workflow-cleanup-tasks
          echo "✅ cleanup-tasks deployed successfully"

      - name: Deploy high-frequency-processor
        if: |
          needs.detect-changes.outputs.high_frequency_processor_changed == 'true' ||
          needs.detect-changes.outputs.lib_changed == 'true' ||
          github.event.inputs.deploy_all == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          echo "Deploying high-frequency-processor..."
          cd modal_apps
          modal deploy high_frequency_processor.py --name high-frequency-processor
          echo "✅ high-frequency-processor deployed successfully"

      - name: Deploy simple-queue-processor
        if: |
          needs.detect-changes.outputs.simple_queue_processor_changed == 'true' ||
          needs.detect-changes.outputs.lib_changed == 'true' ||
          github.event.inputs.deploy_all == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          echo "Deploying simple-queue-processor..."
          cd modal_apps
          modal deploy simple_queue_processor.py --name simple-queue-processor
          echo "✅ simple-queue-processor deployed successfully"

      - name: Test Modal app status
        if: always()
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          echo "Checking deployed apps..."
          modal app list | grep -E "workflow-executor|cleanup-tasks|high-frequency|simple-queue" || echo "Apps not visible yet"

      - name: Send deployment notification
        if: success()
        run: |
          echo "🚀 Modal apps deployed successfully!"
          echo "Deployed at: $(date)"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"

      - name: Handle deployment failure
        if: failure()
        run: |
          echo "❌ Modal deployment failed!"
          echo "Check the logs above for details"
          exit 1