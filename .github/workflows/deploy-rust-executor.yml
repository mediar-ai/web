name: Deploy Rust Executor to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'rust-executor/**'
      - '.github/workflows/deploy-rust-executor.yml'
  workflow_dispatch:  # Allow manual triggers from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-executor

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run Tests
        run: cargo test --lib --tests --verbose

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Instances
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          MEDIAR_SERVICE_API_KEY: ${{ secrets.MEDIAR_SERVICE_API_KEY }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/deploy.sh dev

      - name: Test Health Endpoint
        run: ./scripts/health-check.sh

      - name: Deployment Summary
        run: |
          echo "🚀 Rust Executor Deployment Complete!"
          echo ""
          echo "📍 Endpoints:"
          echo "   Health: http://workflow-executor-dev.eastus.azurecontainer.io:8080/api/v1/health"
          echo "   Queue:  http://workflow-executor-dev.eastus.azurecontainer.io:8080/api/v1/queue/status"
          echo ""
          echo "🔍 View logs:"
          echo "   az container logs -n workflow-executor-dev -g mediar-workflow-executor-rg"
