name: Deploy Rust Executor to Azure (Optimized)

on:
  push:
    branches:
      - main
    paths:
      - 'rust-executor/**'
      - '.github/workflows/deploy-rust-executor-optimized.yml'
  workflow_dispatch:

jobs:
  # Run tests in parallel
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust with caching
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true # Cache ~/.cargo and target/

      - name: Run Tests
        run: |
          cd rust-executor
          cargo test --lib --tests --verbose

  # Build and deploy in parallel with tests
  deploy:
    runs-on: ubuntu-latest
    # Remove needs: [test] to run in parallel, or keep to run after tests pass
    # needs: [test]  # Uncomment for safety (sequential)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Instances
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          MEDIAR_SERVICE_API_KEY: ${{ secrets.MEDIAR_SERVICE_API_KEY }}
          SECRETS_ENCRYPTION_KEY: ${{ secrets.SECRETS_ENCRYPTION_KEY }}
        run: |
          cd rust-executor
          chmod +x scripts/*.sh
          # Use optimized Dockerfile if it exists, otherwise use default
          if [ -f "Dockerfile.optimized" ]; then
            export DOCKERFILE="Dockerfile.optimized"
          fi
          ./scripts/deploy.sh dev

      - name: Test Health Endpoint
        run: |
          cd rust-executor
          ./scripts/health-check.sh

      - name: Deployment Summary
        run: |
          echo "🚀 Rust Executor Deployment Complete!"
          echo ""
          echo "📍 Endpoints:"
          echo "   Health: http://workflow-executor-dev.eastus.azurecontainer.io:8080/api/v1/health"
          echo "   Queue:  http://workflow-executor-dev.eastus.azurecontainer.io:8080/api/v1/queue/status"
          echo ""
          echo "🔍 View logs:"
          echo "   az container logs -n workflow-executor-dev -g mediar-workflow-executor-rg"
