name: Deploy Rust Executor to GCP

on:
  push:
    branches:
      - main
    paths:
      - 'crates/executor/**'
      - '.github/workflows/deploy-rust-executor.yml'
  workflow_dispatch:

env:
  GCP_PROJECT: mediar-394022
  GCP_REGION: us-east1
  SERVICE_NAME: workflow-executor
  ARTIFACT_REGISTRY: us-east1-docker.pkg.dev/mediar-394022/mediar-containers

jobs:
  # Run tests in parallel
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust with caching
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: crates/executor

      - name: Run Tests
        working-directory: crates/executor
        run: cargo test --lib --tests --verbose

  # Build and deploy
  deploy:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('crates/executor/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and Push Docker Image
        env:
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          cd crates/executor

          echo "Building ${{ env.ARTIFACT_REGISTRY }}/${{ env.SERVICE_NAME }}:${IMAGE_TAG}"

          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --tag "${{ env.ARTIFACT_REGISTRY }}/${{ env.SERVICE_NAME }}:${IMAGE_TAG}" \
            --tag "${{ env.ARTIFACT_REGISTRY }}/${{ env.SERVICE_NAME }}:latest" \
            --push \
            --file Dockerfile \
            .

          # Rotate cache
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.ARTIFACT_REGISTRY }}/${{ env.SERVICE_NAME }}:latest \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --cpu 2 \
            --memory 2Gi \
            --min-instances 1 \
            --max-instances 5 \
            --timeout 300 \
            --set-env-vars "^::^RUST_LOG=workflow_executor=debug,tower_http=debug,info" \
            --set-env-vars "ENVIRONMENT=production" \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars "MCP_ENDPOINT=http://4.227.217.44:8080" \
            --set-env-vars "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            --set-env-vars "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            --set-env-vars "OTEL_SDK_ENABLED=true" \
            --set-env-vars "OTEL_EXPORTER_OTLP_ENDPOINT=https://otel-collector-e4mtrji55a-ue.a.run.app" \
            --set-env-vars "APP_URL=${{ secrets.APP_URL }}" \
            --set-env-vars "MEDIAR_SERVICE_API_KEY=${{ secrets.MEDIAR_SERVICE_API_KEY }}" \
            --set-env-vars "MCP_SERVICE_TOKEN=${{ secrets.MCP_SERVICE_TOKEN }}" \
            --set-env-vars "SECRETS_ENCRYPTION_KEY=${{ secrets.SECRETS_ENCRYPTION_KEY }}" \
            --set-env-vars "GCP_PROJECT=${{ env.GCP_PROJECT }}" \
            --set-env-vars "GCP_REGION=${{ env.GCP_REGION }}"

      - name: Test Health Endpoint
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.GCP_REGION }} --format 'value(status.url)')
          echo "Testing health at ${SERVICE_URL}/api/v1/health"

          for i in {1..10}; do
            if curl -sf "${SERVICE_URL}/api/v1/health"; then
              echo ""
              echo "✅ Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "❌ Health check failed after 10 attempts"
          exit 1

      - name: Deployment Summary
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.GCP_REGION }} --format 'value(status.url)')
          echo "🚀 Rust Executor Deployment Complete!"
          echo ""
          echo "📍 Endpoints:"
          echo "   Health: ${SERVICE_URL}/api/v1/health"
          echo "   Queue:  ${SERVICE_URL}/api/v1/queue/status"
          echo ""
          echo "🔍 View logs:"
          echo "   gcloud run services logs read ${{ env.SERVICE_NAME }} --region ${{ env.GCP_REGION }}"
