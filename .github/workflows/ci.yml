name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test:unit
        env:
          SKIP_REAL_API_TESTS: 'true'
          AI_API_PASSWORD: 'dummy-password'
          CLICKHOUSE_HOST: 'dummy-host'
          CLICKHOUSE_PASSWORD: 'dummy-password'

      - name: Verify Build
        run: npm run build
        env:
          # Provide dummy values for build-time environment variables to prevent build failures
          NEXT_PUBLIC_SUPABASE_URL: 'https://example.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'dummy-key'
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: 'pk_test_dummy'
          CLERK_SECRET_KEY: 'sk_test_dummy'
          CRON_SECRET: 'dummy-cron-secret'
