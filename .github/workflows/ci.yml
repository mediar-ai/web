name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Unit Tests
        run: npm run test:unit
        env:
          SKIP_REAL_API_TESTS: 'true'
          AI_API_PASSWORD: 'dummy-password'
          CLICKHOUSE_HOST: 'dummy-host'
          CLICKHOUSE_PASSWORD: 'dummy-password'
