name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        env:
          SKIP_ENV_VALIDATION: 'true'

      - name: Run Web Tests
        run: bun run test:web
        env:
          SKIP_REAL_API_TESTS: 'true'
          AI_API_PASSWORD: 'dummy-password'
          CLICKHOUSE_HOST: 'dummy-host'
          CLICKHOUSE_PASSWORD: 'dummy-password'
