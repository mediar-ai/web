name: Build VNC Gateway Container

on:
  push:
    branches:
      - main
    paths:
      - "infra/vnc-gateway/**"
      - ".github/workflows/build-vnc-gateway.yml"

  workflow_dispatch:

env:
  GCP_PROJECT: mediar-394022
  GCP_REGION: us-east1
  IMAGE_NAME: vnc-gateway

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for GCP
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push container
        run: |
          cd infra/vnc-gateway

          TAG=$(date +%Y%m%d-%H%M%S)
          REGISTRY="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/mediar-containers"

          docker build -t ${REGISTRY}/${{ env.IMAGE_NAME }}:${TAG} .
          docker tag ${REGISTRY}/${{ env.IMAGE_NAME }}:${TAG} ${REGISTRY}/${{ env.IMAGE_NAME }}:latest

          docker push ${REGISTRY}/${{ env.IMAGE_NAME }}:${TAG}
          docker push ${REGISTRY}/${{ env.IMAGE_NAME }}:latest

          echo "Pushed: ${REGISTRY}/${{ env.IMAGE_NAME }}:${TAG}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy vnc-gateway \
            --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/mediar-containers/${{ env.IMAGE_NAME }}:latest \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --set-env-vars SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --set-env-vars SUPABASE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} \
            --set-env-vars VNC_PASSWORD=mediar12

      - name: Summary
        run: |
          echo "### VNC Gateway Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** `${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/mediar-containers/${{ env.IMAGE_NAME }}:latest`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployed to Cloud Run: vnc-gateway" >> $GITHUB_STEP_SUMMARY
